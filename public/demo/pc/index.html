<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Windows PC Demo — GameCenter & CafeCenter</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#0b1020;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
  .desktop{height:100vh;display:flex;flex-direction:column}
  .screen{flex:1;position:relative;background:#000}
  .screen iframe{width:100%;height:100%;border:0;display:block}
  .screen .frame{display:none;position:absolute;inset:0}
  .screen .frame.on{display:block}

  /* Demo çıkış pill'i */
  .exit{position:absolute;left:14px;top:12px;z-index:20;display:inline-flex;align-items:center;gap:7px;
    font-size:12.5px;color:#e7ebf3;background:rgba(20,24,34,.72);border:1px solid rgba(255,255,255,.14);
    padding:7px 13px;border-radius:10px;text-decoration:none;backdrop-filter:blur(8px);transition:.15s}
  .exit:hover{background:rgba(30,36,50,.9);border-color:rgba(255,255,255,.28)}

  /* Görev çubuğu (Windows 11) */
  .taskbar{height:48px;flex:0 0 48px;display:flex;align-items:center;padding:0 12px;
    background:rgba(24,28,38,.86);backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.07);color:#e7ebf3}
  .tstart{width:40px;height:40px;display:grid;place-items:center;border-radius:8px;cursor:pointer}
  .tstart:hover{background:rgba(255,255,255,.08)}
  .winlogo{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2.5px;width:18px;height:18px}
  .winlogo i{background:#4db8ff;border-radius:1px}
  .tapps{flex:1;display:flex;justify-content:center;gap:6px}
  .tapp{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:52px;height:40px;
    border-radius:8px;cursor:pointer;position:relative;transition:.12s;color:#cdd3df}
  .tapp:hover{background:rgba(255,255,255,.08)}
  .tapp .ic{font-size:21px;line-height:1}
  .tapp .bar{position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:transparent}
  .tapp.on{background:rgba(255,255,255,.10);color:#fff}
  .tapp.on .bar{width:16px;height:3px;border-radius:3px;background:#4db8ff}
  .ttray{display:flex;align-items:center;gap:16px;padding-left:8px}
  .sys{display:flex;align-items:center;gap:11px;font-size:15px;color:#cdd3df}
  .clock{text-align:right;line-height:1.15;cursor:default}
  .clock .t{font-size:12.5px;font-variant-numeric:tabular-nums}
  .clock .d{font-size:11px;color:#aeb6c4}

  .tip{position:absolute;left:50%;bottom:60px;transform:translateX(-50%);z-index:15;font-size:12px;color:#cdd3df;
    background:rgba(20,24,34,.8);border:1px solid rgba(255,255,255,.14);padding:7px 14px;border-radius:999px;backdrop-filter:blur(8px);
    animation:fade 6s ease forwards;pointer-events:none;white-space:nowrap}
  @keyframes fade{0%,70%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<div class="desktop">
  <div class="screen">
    <a class="exit" href="/demo/">&larr; Demo Menüsü</a>
    <div class="tip">Alttaki görev çubuğundan uygulamalar arasında geçin ↓</div>
    <div class="frame on" data-app="gc"><iframe src="/demo/pc/gamecenter.html" title="GameCenter"></iframe></div>
    <div class="frame" data-app="welcome"><iframe data-src="/demo/pc/welcome.html" title="CafeCenter Karşılama"></iframe></div>
    <div class="frame" data-app="session"><iframe data-src="/demo/pc/session.html" title="CafeCenter Oturum"></iframe></div>
  </div>

  <div class="taskbar">
    <div class="tstart" title="Başlat"><div class="winlogo"><i></i><i></i><i></i><i></i></div></div>
    <div class="tapps">
      <div class="tapp on" data-app="gc" title="GameCenter — Oyun İstemcisi"><span class="ic">🎮</span><span class="bar"></span></div>
      <div class="tapp" data-app="welcome" title="CafeCenter — Masa Karşılama"><span class="ic">☕</span><span class="bar"></span></div>
      <div class="tapp" data-app="session" title="CafeCenter — Oturum (masaüstü + bar)"><span class="ic">📊</span><span class="bar"></span></div>
    </div>
    <div class="ttray">
      <div class="sys"><span title="Ağ">📶</span><span title="Ses">🔊</span><span title="Pil">🔋</span></div>
      <div class="clock"><div class="t" id="clk">--:--</div><div class="d" id="dt">—</div></div>
    </div>
  </div>
</div>

<script>
  // Uygulama geçişi (lazy iframe yükleme)
  var frames = document.querySelectorAll('.frame');
  var apps = document.querySelectorAll('.tapp');
  function show(app){
    frames.forEach(function(f){
      var on = f.getAttribute('data-app') === app;
      f.classList.toggle('on', on);
      if(on){ var ifr = f.querySelector('iframe'); if(ifr && !ifr.src && ifr.dataset.src) ifr.src = ifr.dataset.src; }
    });
    apps.forEach(function(a){ a.classList.toggle('on', a.getAttribute('data-app') === app); });
  }
  apps.forEach(function(a){ a.addEventListener('click', function(){ show(a.getAttribute('data-app')); }); });

  // Canlı saat
  var months=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
  function tick(){
    var n=new Date();
    document.getElementById('clk').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
    document.getElementById('dt').textContent=n.getDate()+' '+months[n.getMonth()]+' '+n.getFullYear();
  }
  tick(); setInterval(tick, 10000);
</script>
</body>
</html>
