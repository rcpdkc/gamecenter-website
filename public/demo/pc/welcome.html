<title>CafeCenter Karşılama</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0b0d14; --card:#141722; --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
    --txt:#e7ebf3; --mut:#8b96a9; --indigo:#6366f1; --green:#10b981;
    --font:"Segoe UI","Segoe UI Variable Text",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);color:var(--txt);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
  .screen{position:relative;min-height:100vh;display:flex;flex-direction:column}

  /* Üst bar — sade */
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:22px 30px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:11px}
  .brand .cafe{font-size:19px;font-weight:800;letter-spacing:-.01em}
  .brand .pc{color:var(--mut);font-size:12.5px;display:flex;align-items:center;gap:6px;margin-top:2px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
  .clock .t{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;line-height:1}
  .clock .d{font-size:12px;color:var(--mut);text-align:right;margin-top:3px}

  /* Orta */
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
  .center h1{font-size:26px;font-weight:800;margin-bottom:4px}
  .center .sub{color:var(--mut);font-size:14px;margin-bottom:28px}

  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%;max-width:620px}
  .opt{display:flex;align-items:center;gap:14px;padding:20px;border-radius:14px;cursor:pointer;
    background:var(--card);border:1px solid var(--line2);transition:border-color .15s,background .15s}
  .opt:hover{border-color:var(--indigo);background:#171a26}
  .opt .ic{width:44px;height:44px;flex:0 0 44px;border-radius:11px;display:grid;place-items:center;font-size:22px;
    background:rgba(255,255,255,.06)}
  .opt .tt{font-size:16px;font-weight:700}

  .footer{text-align:center;padding:14px;color:rgba(255,255,255,.30);font-size:11px}
  .admin{position:absolute;right:22px;bottom:16px;font-size:12px;color:var(--mut);cursor:pointer;
    padding:8px 13px;border:1px solid var(--line2);border-radius:9px;transition:.15s}
  .admin:hover{color:var(--txt);border-color:var(--line2)}

  @media (max-width:640px){.grid{grid-template-columns:1fr;max-width:380px}}
</style>

<div class="screen">
  <div class="topbar">
    <div class="brand">
      <div>
        <div class="cafe">OYUN DİYARI</div>
        <div class="pc"><span class="dot"></span>PC-14 · Bağlı</div>
      </div>
    </div>
    <div class="clock">
      <div class="t">16:55</div>
      <div class="d">15 Ağustos 2026</div>
    </div>
  </div>

  <div class="center">
    <h1>Hoş geldiniz</h1>
    <div class="sub">Başlamak için bir seçenek seçin</div>
    <div class="grid">
      <div class="opt"><div class="ic">🎮</div><div class="tt">Oturum Aç</div></div>
      <div class="opt"><div class="ic">⏱️</div><div class="tt">Süreli Paket</div></div>
      <div class="opt"><div class="ic">👤</div><div class="tt">Üye Girişi</div></div>
      <div class="opt"><div class="ic">🎫</div><div class="tt">Bilet ile Giriş</div></div>
    </div>
  </div>

  <div class="footer">GameCenter · CafeCenter</div>
  <div class="admin">🔑 Yönetici Girişi</div>
</div>
